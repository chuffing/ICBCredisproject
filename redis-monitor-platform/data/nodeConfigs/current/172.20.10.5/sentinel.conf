bind 0.0.0.0
protected-mode no
port 26379
daemonize no
supervised no
pidfile /run/redis-sentinel.pid
logfile /opt/redis/logs/sentinel.log
dir /opt/redis/data/sentinel
requirepass RedisTest123!
sentinel monitor mymaster 172.20.10.5 6379 2
sentinel auth-pass mymaster RedisTest123!
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 15000
sentinel parallel-syncs mymaster 1
