server:
  port: 8100

platform:

  offline-threshold: 70      # 离线判定阈值（秒）

  status-check:
    fixed-delay-ms: ${STATUS_CHECK_FIXED_DELAY_MS:30000}            # 执行器/实例状态主动校正间隔（毫秒）
  sentinel:
    # 哨兵随指标每 5 分钟上报一次，阈值需大于采集周期（默认 330s = 5.5min）
    offline-threshold-seconds: 330
  operation-task:
    # 执行结果超时扫描间隔，毫秒。
    timeout-scan-interval-millis: 5000
    # 没有为操作类型单独配置时使用的默认等待时间，秒。
    default-result-timeout-seconds: 180
    # 不同操作的实际耗时不同，因此分别设置执行结果等待时间。
    result-timeout-seconds:
      STOP_REDIS: 150
      STOP_SENTINEL: 150
      RESTORE_CONFIG: 150
      DEPLOY_VERSION: 1860
      SWITCH_VERSION: 90
      START_REDIS: 180
      START_SENTINEL: 180
  version-package:
    # 必须使用不含首尾空格、.或..路径段的绝对路径，目录需提前创建并具备读写访问权限。
    storage-dir: E:/tmp/versionPackages
    max-bytes: 52428800
  node-config:
    # 当前正式配置放在current/{IP}/下；服务器切换配置人工放入staging/{IP}/下。
    # 必须使用不含首尾空格、.或..路径段的绝对路径，current和staging目录需提前创建并具备读写访问权限。
    config-dir: E:/tmp/nodeConfigs
  alarm:
    notice:
      enabled: false                    # 告警邮件通知开关
      receivers:                        # 接收人列表
        - ops@example.com
    auto-recover:
      periods: 2                        #连续回落周期数，达到后自动恢复；<=0 关闭自动恢复

  register-code: Danuvius
  retain-days: 7


spring:
  task:
    scheduling:
      pool:
        size: 4                         # 执行器/哨兵状态校正、告警检测、任务超时扫描并行执行，避免互相阻塞
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  mail:                                 # 启用邮件通知时配置
    host: smtp.example.com
    username: notice@example.com
    password: xxxx
  application:
    name: redis-monitor-platform
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
    username: postgres.dbtakxbjecdydxfeytov
    password: Danuvius5732
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl




logging:
  level:
    com.danuvius.platform: INFO
