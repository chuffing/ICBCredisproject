server:
  port: 8100

platform:
  instance:
    offline-threshold-seconds: 70      # 实例离线判定阈值（秒）
  sentinel:
    # 哨兵随指标每 5 分钟上报一次，阈值需大于采集周期（默认 330s = 5.5min）
    offline-threshold-seconds: 330
  operation-task:
    # 执行结果超时扫描间隔，毫秒。
    timeout-scan-interval-millis: 5000
    # 没有为操作类型单独配置时使用的默认等待时间，秒。
    default-result-timeout-seconds: 180
    # 不同操作的实际耗时不同，因此分别设置执行结果等待时间。
    result-timeout-seconds:
      STOP_REDIS: 150
      STOP_SENTINEL: 150
      RESTORE_CONFIG: 150
      DEPLOY_VERSION: 1860
      SWITCH_VERSION: 90
      START_REDIS: 180
      START_SENTINEL: 180
      VERIFY_TOPOLOGY: 90
  version-package:
    storage-dir: ${PLATFORM_VERSION_PACKAGE_DIR:./data/versionPackages}
    max-bytes: ${PLATFORM_VERSION_PACKAGE_MAX_BYTES:52428800}
  node-config:
    # 当前正式配置放在current/{IP}/下；服务器切换配置人工放入staging/{IP}/下。
    config-dir: ${PLATFORM_NODE_CONFIG_DIR:./data/nodeConfigs}
  alarm:
    notice:
      enabled: false                    # 告警邮件通知开关
      receivers:                        # 接收人列表
        - ops@example.com
    auto-recover:
      periods: 2                        #连续回落周期数，达到后自动恢复；<=0 关闭自动恢复

  register-code: ${REGISTER_CODE:Danuvius}
  retain-days: ${RETAIN_DAYS:7}
  report:
    export-dir: ${REPORT_EXPORT_DIR:./exports}
    download-prefix: /report/download


spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  mail:                                 # 启用邮件通知时配置
    host: smtp.example.com
    username: notice@example.com
    password: xxxx
  application:
    name: redis-monitor-platform
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://db.izikxhetvxbnlukyytae.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: ZJYrrZJY7518
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl




logging:
  level:
    com.danuvius.platform: INFO
